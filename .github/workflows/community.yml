# Community site: tells it when a PR changes, and sends it a screenshot of the PR's preview after
# logging in, for the PR's card.
# Runs on pull_request_target so this file always comes from main. It never checks out PR code.
# The PR's game runs only in the browser of the `shoot` job, which holds no secret. `notify` and `upload`
# hold the token and never load a PR page. The site re-reads PR facts from GitHub itself and re-encodes
# the image, so nothing sent here is trusted.
# Settings (Settings > Secrets and variables > Actions): variables COMMUNITY_URL and PREVIEW_URL
# (with {number}), secret COMMUNITY_HOOK_TOKEN. Missing settings: the jobs do nothing.
name: community

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed, ready_for_review, converted_to_draft]

permissions: {}

jobs:
  notify:
    name: notify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tell the community site this PR changed
        env:
          COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
          TOKEN: ${{ secrets.COMMUNITY_HOOK_TOKEN }}
          N: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$COMMUNITY_URL" ] || [ -z "$TOKEN" ]; then echo "::notice::community site not configured"; exit 0; fi
          curl -fsS -m 20 --retry 3 -o /dev/null -X POST -H "Authorization: Bearer $TOKEN" "$COMMUNITY_URL/api/hook/pr/$N"

  shoot:
    name: screenshot
    if: >-
      vars.PREVIEW_URL != '' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: community-shoot-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      ready: ${{ steps.wait.outputs.ready }}
    steps:
      - name: Wait for the preview of this commit
        id: wait
        env:
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
          N: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url="${PREVIEW_URL//\{number\}/$N}"
          url="${url%/}/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # The preview host says which commit it serves. 80 x 15 s = 20 min, enough for a build.
          for _ in $(seq 80); do
            got=$(curl -sS -m 10 -o /dev/null -D - "${url}?commit=$SHA" 2>/dev/null | tr -d '\r' |
              awk 'tolower($1) == "x-preview-commit:" { print $2 }')
            if [ "$got" = "$SHA" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 15
          done
          echo "::notice::No preview of this commit after 20 minutes (deploy-gate refused, build failed, or evicted): no screenshot."

      - name: Screenshot after logging in
        if: steps.wait.outputs.ready == 'true'
        env:
          URL: ${{ steps.wait.outputs.url }}
        run: |
          # The PR's page runs in Chrome with its sandbox on, as a user without sudo, so even a browser
          # exploit can't reach this job's runner (its cache scope is main's, pull_request_target).
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 # lets Chrome's sandbox start
          sudo useradd --create-home --shell /usr/sbin/nologin shooter
          sudo install -d -o shooter -g shooter -m 755 /tmp/shot
          sudo -u shooter tee /tmp/shot/shoot.mjs > /dev/null <<'EOF'
          // Screenshot of a PR preview after logging in: node shoot.mjs <https url> <out.png>
          import { chromium } from 'playwright-core';
          const [url, out] = process.argv.slice(2);
          if (!/^https:\/\/[a-z0-9.-]+\/$/.test(url || '') || !out) { console.error('usage: shoot.mjs https://host/ out.png'); process.exit(2); }
          const fail = (phase, e) => { console.error(`failed: ${phase}: ${e?.message ?? e}`); process.exit(1); };
          setTimeout(() => fail('total', 'over 120 s'), 120_000).unref();
          const browser = await chromium.launch({
            channel: process.env.CHROME_CHANNEL || undefined,
            // Playwright adds --no-sandbox unless told otherwise. The sandbox must start, or the shot fails.
            chromiumSandbox: true,
            args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'],
          }).catch(e => fail('launch', e));
          try {
            // Refuse to load the PR's page unless Chrome reports its sandbox working.
            const check = await browser.newPage();
            await check.goto('chrome://sandbox').catch(e => fail('sandbox', e));
            const status = await check.evaluate(() => document.body.innerText).catch(e => fail('sandbox', e));
            if (!/You are adequately sandboxed/.test(status)) fail('sandbox', 'Chrome is not adequately sandboxed');
            await check.close();
            const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
            await page.goto(url, { waitUntil: 'load', timeout: 60_000 }).catch(e => fail('load', e));
            // Godot's loader removes or hides #status once the engine runs.
            await page.waitForFunction(() => { const s = document.getElementById('status'); return !s || s.style.display === 'none' || s.style.visibility === 'hidden'; },
              null, { timeout: 60_000 }).catch(e => fail('engine', e));
            await page.waitForTimeout(1500);
            // The login panel sits in the middle of the screen. Once the server welcomes the player it disappears,
            // so most of that area changes. Shoot only then: never a screenshot of the login screen.
            const panel = { x: 500, y: 280, width: 280, height: 160 };
            const before = await page.screenshot({ clip: panel });
            const helper = await browser.newPage(); // compares images, away from the PR's page
            const changed = async () => helper.evaluate(async ([a, b]) => {
              const load = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
              const [ia, ib] = await Promise.all([load(a), load(b)]);
              const c = document.createElement('canvas'); c.width = ia.width; c.height = ia.height;
              const g = c.getContext('2d');
              g.drawImage(ia, 0, 0); const da = g.getImageData(0, 0, c.width, c.height).data;
              g.drawImage(ib, 0, 0); const db = g.getImageData(0, 0, c.width, c.height).data;
              let n = 0;
              for (let k = 0; k < da.length; k += 4) {
                if (Math.abs(da[k] - db[k]) + Math.abs(da[k + 1] - db[k + 1]) + Math.abs(da[k + 2] - db[k + 2]) > 60) n++;
              }
              return n / (da.length / 4);
            }, ['data:image/png;base64,' + before.toString('base64'),
                'data:image/png;base64,' + (await page.screenshot({ clip: panel })).toString('base64')]);
            await page.keyboard.type('screenshot-bot', { delay: 40 });
            await page.keyboard.press('Enter');
            const deadline = Date.now() + 30_000;
            let share = 0;
            while ((share = await changed()) < 0.8) {
              if (Date.now() > deadline) fail('join', `login panel still shown after 30 s (${share.toFixed(2)} changed)`);
              await page.waitForTimeout(500);
            }
            await page.waitForTimeout(2000);
            await page.screenshot({ path: out, type: 'png' });
          } finally {
            await browser.close();
          }
          EOF
          cd /tmp/shot
          sudo -u shooter -H npm init -y > /dev/null
          sudo -u shooter -H npm install --no-audit --no-fund --ignore-scripts playwright-core@1.64.1 > /dev/null
          # Chrome needs writable XDG dirs (else its crash handler aborts the launch).
          sudo -u shooter -H env CHROME_CHANNEL=chrome XDG_CONFIG_HOME=/tmp/shot/.config XDG_CACHE_HOME=/tmp/shot/.cache \
            node shoot.mjs "$URL" shot.png
          # From here on, shooter is untrusted: stop all its processes, read the file as shooter (never
          # follow a link it planted as the runner), at most 2 MiB, and keep it only if it is a PNG.
          sudo pkill -KILL -u shooter || true
          install -d "$RUNNER_TEMP/shot"
          # shellcheck disable=SC2024 # on purpose: shooter reads, the runner writes
          sudo -u shooter head -c 2097153 /tmp/shot/shot.png > "$RUNNER_TEMP/shot/shot.png"
          f="$RUNNER_TEMP/shot/shot.png"
          if [ "$(stat -c %s "$f")" -gt 2097152 ] || [ "$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
            echo "::error::not a PNG of at most 2 MiB"; rm -f "$f"; exit 1
          fi

      - name: Keep the screenshot for the upload job
        if: steps.wait.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot
          path: ${{ runner.temp }}/shot/shot.png
          retention-days: 1
          if-no-files-found: error

  upload:
    name: upload screenshot
    needs: shoot
    if: needs.shoot.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshot
          path: ${{ runner.temp }}/shot

      - name: Send it to the community site
        env:
          COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
          TOKEN: ${{ secrets.COMMUNITY_HOOK_TOKEN }}
          N: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$COMMUNITY_URL" ] || [ -z "$TOKEN" ]; then echo "::notice::community site not configured"; exit 0; fi
          f="$RUNNER_TEMP/shot/shot.png"
          if [ "$(stat -c %s "$f")" -gt 2097152 ]; then echo "::error::screenshot over 2 MiB"; exit 1; fi
          code=$(curl -sS -m 60 --retry 3 -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: image/png" --data-binary @"$f" \
            "$COMMUNITY_URL/api/hook/pr/$N/screenshot?sha=$SHA")
          case "$code" in
            204) echo "stored" ;;
            409) echo "::notice::the site already shows a newer commit" ;;
            *) echo "::error::community site answered $code"; exit 1 ;;
          esac
